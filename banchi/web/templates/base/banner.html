<div class="hero min-h-[60vh] bg-neutral text-neutral-content">
  <div class="hero-content text-center flex-col gap-8 lg:flex-row lg:gap-16">
    <div>
      <i class="fa-solid fa-book text-8xl"></i>
      <div class="pt-3 text-lg">
        โปรแกรมบัญชี
      </div>
    </div>
    <div>
      <h1 class="text-6xl font-bold">{{ config.get('APP_TITLE') }}</h1>
      <h2 class="py-4 text-2xl">Banchi, Import Star, Please Login.</h2>
      <div class="pt-4 flex justify-center gap-3">
        {% if not current_user.is_authenticated %}
          <a href="{{ url_for('users.login') }}" class="btn btn-primary btn-lg"><i class="fa-solid fa-right-to-bracket"></i>Login</a>
        {% else %}
          <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary btn-lg"><i class="fa-solid fa-gauge"></i>Dashboard</a>
          <a href="{{ url_for('users.logout') }}" class="btn btn-primary btn-lg"><i class="fa-solid fa-right-from-bracket"></i>Logout</a>
        {% endif %}
      </div>
    </div>
  </div>
</div>
